<div class="grid mt-2 pt-2 d-flex">
  @for(action of internalActions(); track action){
  <cn-action-tile
    [description]="action.description"
    [icon]="action.icon"
    [label]="action.label"
    [url]="action.url"
    (click)="handleItemClick(action, $event)"
  >
  </cn-action-tile>
  }
</div>
