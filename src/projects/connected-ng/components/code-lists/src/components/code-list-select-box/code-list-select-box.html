<mat-form-field
  class="code-list-select-box"
  [floatLabel]="selectedItem() != null ? 'always' : 'auto'"
>
  @if (label()) {
  <mat-label>{{ label() }}</mat-label>
  }

  <mtx-select
    [items]="allItems()"
    [value]="selectedItem()"
    [placeholder]="placeholder()"
    [disabled]="isDisabled()"
    [required]="required()"
    [searchFn]="searchFn"
    [compareWith]="compareWithFn"
    [clearable]="!required()"
    [errorStateMatcher]="errorStateMatcher"
    (change)="onSelectionChange($event)"
    (blur)="onTouched()"
  >
    <ng-template
      ng-label-tmp
      let-item="item"
    >
      @if (itemTemplate()) {
      <ng-container
        *ngTemplateOutlet="itemTemplate()!; context: { $implicit: item }"
      ></ng-container>
      } @else { {{ displayMemberSelector()(item) }} }
    </ng-template>

    <ng-template
      ng-option-tmp
      let-item="item"
    >
      @if (itemTemplate()) {
      <ng-container
        *ngTemplateOutlet="itemTemplate()!; context: { $implicit: item }"
      ></ng-container>
      } @else { {{ displayMemberSelector()(item) }} }
    </ng-template>
  </mtx-select>
  <mat-error i18n="@@cn.form-field.required">This field is required!</mat-error>

  @if (insertFormComponent()) {
  <button
    class="icon-btn-sm mr-3"
    matIconButton
    matIconSuffix
    type="button"
    (click)="openInsertDialog();$event.stopPropagation()"
  >
    <mat-icon>add</mat-icon>
  </button>
  }

  <!-- @if (insertFormComponent()) {
    <mat-icon
    matIconSuffix
    (click)="openInsertDialog()"
    class="add-icon"
    >add</mat-icon
  >
  } -->
</mat-form-field>
