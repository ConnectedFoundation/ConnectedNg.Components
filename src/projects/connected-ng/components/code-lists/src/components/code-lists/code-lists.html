<cn-code-list-list
  [items]="codeListService.codeLists()"
  [itemTemplate]="itemTemplate"
>
</cn-code-list-list>

<ng-template
  #itemTemplate
  let-item
>
  <a
    class="stretched-link anim-underline text-wrap"
    href="./{{item.pattern ?? item.key}}"
    (click)="$event.preventDefault(); openCodeList(item)"
    >{{item.title}}</a
  >
</ng-template>
