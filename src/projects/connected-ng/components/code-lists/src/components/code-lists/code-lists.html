<cn-code-list-list
  [items]="codeListService.codeLists()"
  [itemTemplate]="itemTemplate"
  [filter]="filter"
  [paginate]="true"
  [pageSize]="20"
  [pageSizeOptions]="[10, 20, 50]"
  [hidePageSize]="true"
>
</cn-code-list-list>

<ng-template
  #itemTemplate
  let-item
>
  <a
    class="stretched-link anim-underline1 list-item-title text-wrap"
    href="./{{item.pattern ?? item.key}}"
    (click)="$event.preventDefault(); openCodeList(item)"
    >{{item.title}}</a
  >
</ng-template>
