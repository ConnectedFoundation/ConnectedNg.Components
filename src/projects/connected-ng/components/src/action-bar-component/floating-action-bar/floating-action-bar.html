<cn-carousel
  [visibleItems]="{'0': 1, '576': 2, '992': 2}"
  [showChevrons]="true"
  [showIndicators]="false"
  class="w-10"
>
  @for(action of actions(); track action){
  <cn-carousel-item style="position: relative">
    <cn-action-tile
      [description]="action.description"
      [icon]="action.icon"
      [label]="action.label"
      [url]="action.url"
      [disabled]="action.disabled ?? false"
      (click)="handleItemClick(action, $event)"
    ></cn-action-tile>
  </cn-carousel-item>
  }
</cn-carousel>
