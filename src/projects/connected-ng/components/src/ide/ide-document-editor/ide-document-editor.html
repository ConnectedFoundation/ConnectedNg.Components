<div class="tabs-header">
  <nav
    mat-tab-nav-bar
    mat-stretch-tabs="false"
    mat-align-tabs="start"
    [tabPanel]="tabPanel"
  >
    @for (document of activeEditorInstances(); track document) {
    <a
      mat-tab-link
      (click)="onTabClick(document)"
      [active]="isDocumentSelected(document)"
    >
      <span>{{ document.name }}</span>
      <span
        style="align-self: end"
        (click)="onCloseDocument(document); $event.stopPropagation()"
      >
        X
      </span>
    </a>
    }
  </nav>
</div>
<mat-tab-nav-panel #tabPanel></mat-tab-nav-panel>
<div class="editor-content">
  <ng-template [cdkPortalOutlet]="editorPortal()"></ng-template>
</div>
