<cn-action-bar-component [actions]="actions()">

<div>
  @if(pageInfo().headerComponent){
  <ng-container
    *ngComponentOutlet="pageInfo()!.headerComponent!; inputs: {data: pageInfo()!.data}"
  ></ng-container>
  }
</div>

<fieldset>
  <legend>{{pageInfo().title}}</legend>
  <ng-container #componentContainer></ng-container>
</fieldset>
</cn-action-bar-component>
